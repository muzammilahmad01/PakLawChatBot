services:
  # ================================
  # Backend: Python FastAPI
  # ================================
  backend:
    platform: linux/amd64
    image: muzammil588/paklawchatbot-backend:latest
    ports:
      - "5000:5000"
    env_file:
      - ChatBot/.env
    volumes:
      - ./ChatBot/vectorstores:/app/vectorstores
    restart: unless-stopped

  # ================================
  # Frontend: React + Nginx
  # ================================
  frontend:
    platform: linux/amd64
    image: muzammil588/paklawchatbot-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
